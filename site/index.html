<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Present for Kids</title>
<meta name="description" content="世界で起きている危機と改善の兆しを、地図とタイムラインで俯瞰するサイト / A world map and timeline of crises and signs of improvement">
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 画面の骨組みだけを書き、中身は app.js が作る。data-i18n の付いた要素の文字は app.js が日本語/英語で差し込む -->
<header class="top">
  <div class="brand">
    <h1>Present for Kids</h1>
    <p class="tagline" data-i18n="tagline"></p>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ja">日本語</button>
    <button type="button" data-lang="en">English</button>
  </div>
</header>

<!-- 地図・右パネル・タイムラインの3つの区画。配置は style.css の .layout で決める -->
<main class="layout">
  <section class="map-wrap" aria-label="map">
    <div id="map"></div>
    <div class="map-note" id="map-note" hidden></div>
    <div class="choro-legend" id="choro-legend" hidden></div>
  </section>

  <aside class="panel">
    <div class="summary" id="summary" aria-live="polite"></div>

    <fieldset class="filters">
      <legend data-i18n="categories"></legend>
      <div id="cat-filters" class="chips"></div>
    </fieldset>

    <fieldset class="filters">
      <legend data-i18n="direction"></legend>
      <div id="dir-filters" class="chips"></div>
    </fieldset>

    <fieldset class="filters toggles">
      <legend data-i18n="layers"></legend>
      <label><input type="checkbox" id="toggle-news" checked> <span data-i18n="showNews"></span></label>
      <p class="hint" data-i18n="newsHint"></p>
      <label><input type="checkbox" id="toggle-choro"> <span data-i18n="showChoro"></span></label>
    </fieldset>

    <div class="list-head">
      <h2 data-i18n="listTitle"></h2>
      <span class="muted" id="list-count"></span>
    </div>
    <ol class="event-list" id="event-list"></ol>
  </aside>

  <section class="timeline-wrap" aria-label="timeline">
    <div class="timeline-head">
      <h2 data-i18n="timeline"></h2>
      <div class="ranges" role="group" id="ranges">
        <button type="button" data-days="1" data-i18n="r1"></button>
        <button type="button" data-days="7" data-i18n="r7"></button>
        <button type="button" data-days="30" data-i18n="r30"></button>
        <button type="button" data-days="0" data-i18n="rAll"></button>
      </div>
    </div>
    <div id="timeline" class="timeline"></div>
    <p class="hint" data-i18n="timelineHint"></p>
  </section>
</main>

<footer class="foot">
  <p data-i18n="about"></p>
  <div id="status" class="status"></div>
  <p class="credits" data-i18n-html="credits"></p>
</footer>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<!-- 地図ライブラリ MapLibre GL JS 5.24.0(BSD-3)をリポジトリに同梱して読み込む。外部 CDN を使わない理由は app.js の冒頭を参照 -->
<script src="vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
